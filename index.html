<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCTT Granada</title>
<meta name="description" content="Buscador de centros de transformación, elementos de maniobra y apoyos de MT con navegación hasta cada uno.">
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CCTT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <div id="map" role="application" aria-label="Mapa de centros de transformación"></div>

  <div id="top">
    <div class="searchbox">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false" placeholder="CT, maniobra, apoyo, línea MT…" aria-label="Buscar centro de transformación, elemento de maniobra o apoyo">
      <button class="iconbtn" id="clear" type="button" aria-label="Borrar búsqueda" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="filters">
      <button class="chip" id="f-endesa" type="button" aria-pressed="true"><span class="dot" style="background:var(--endesa)"></span>Endesa <span class="n" id="n-endesa"></span></button>
      <button class="chip" id="f-ext" type="button" aria-pressed="true"><span class="dot" style="background:var(--ext)"></span>Externos <span class="n" id="n-ext"></span></button>
      <button class="chip" id="f-ddmm" type="button" aria-pressed="false" title="Se dibujan al acercar el mapa"><span class="dot" style="background:var(--ddmm)"></span>Maniobra <span class="n" id="n-ddmm"></span></button>
      <button class="chip" id="f-apoyo" type="button" aria-pressed="false" title="Se dibujan al acercar el mapa"><span class="dot" style="background:var(--apoyo)"></span>Apoyos MT <span class="n" id="n-apoyo"></span></button>
    </div>
    <div id="results" hidden></div>
  </div>

  <div id="side">
    <button class="iconbtn" id="b-sat" type="button" aria-label="Cambiar a vista satélite" title="Satélite">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/></svg>
    </button>
    <button class="iconbtn" id="b-loc" type="button" aria-label="Centrar en mi ubicación" title="Mi ubicación">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>

  <div id="sheet" hidden aria-live="polite"></div>
  <div id="tilenote" hidden>Sin conexión: el mapa de fondo no carga. El buscador y los puntos funcionan.</div>
  <div id="toast" hidden></div>
</div>
<script src="lib/leaflet.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator){
  // When a new version takes over, reload once so code and data match
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded){ reloaded = true; location.reload(); } });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {}));
}
</script>
</body>
</html>
