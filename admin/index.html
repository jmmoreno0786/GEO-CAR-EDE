<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTT Granada se ha mudado</title>
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://geocarede.github.io/">
<link rel="canonical" href="https://geocarede.github.io/">
<style>
  :root{--bg:#eef1f4;--fg:#17212b;--accent:#1f5fbf}
  @media (prefers-color-scheme: dark){:root{--bg:#10161d;--fg:#e6ebf0;--accent:#6ea2f0}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:24px;box-sizing:border-box;text-align:center}
  a{color:var(--accent);font-weight:600}
</style>
<script>
  // Lleva a la dirección nueva conservando la ruta (por ejemplo /admin/) y el enlace a un CT (#ct-…)
  var resto = location.pathname.replace(/^\/GEO-CAR-EDE\/?/i, '');
  location.replace('https://geocarede.github.io/' + resto + location.hash);
</script>
</head>
<body>
  <p>CCTT Granada se ha mudado a <a href="https://geocarede.github.io/">geocarede.github.io</a>.<br>Si no te lleva automáticamente, pulsa el enlace y vuelve a instalar la app desde allí.</p>
</body>
</html>
